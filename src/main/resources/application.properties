spring.application.name=mock-receipt-maker
server.port=9090
# Never put the session id in URLs (redirects would otherwise go to "/;jsessionid=...")
server.servlet.session.tracking-modes=cookie

spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB

# Where generated receipts are written. Old *.png files in this folder are removed on startup.
app.output-dir=generated-receipts
app.currency=INR
app.max-rows=200
